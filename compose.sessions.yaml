name: mediadeck

services:
  brave-origin-image:
    build:
      context: ./workers/brave-origin
    image: ${BROWSER_WORKER_IMAGE:-mediadeck-brave-origin:0.1.0}
    entrypoint: ['/bin/true']
    restart: 'no'

  app:
    depends_on:
      brave-origin-image:
        condition: service_completed_successfully
    environment:
      BROWSER_DATA_VOLUME: ${MEDIADECK_DATA_VOLUME:-mediadeck-data}
      BROWSER_FRAMERATE: ${BROWSER_FRAMERATE:-30}
      BROWSER_DRI_DEVICE: ${BROWSER_DRI_DEVICE:-/dev/dri/renderD128}
      BROWSER_PGID: ${PGID:-1000}
      BROWSER_PUID: ${PUID:-1000}
      BROWSER_SESSION_HEALTH_INTERVAL_SECONDS: ${BROWSER_SESSION_HEALTH_INTERVAL_SECONDS:-15}
      BROWSER_SESSION_IDLE_TIMEOUT_SECONDS: ${BROWSER_SESSION_IDLE_TIMEOUT_SECONDS:-1800}
      BROWSER_START_URL: ${BROWSER_START_URL:-https://www.youtube.com/}
      BROWSER_VIDEO_BITRATE: ${BROWSER_VIDEO_BITRATE:-6}
      BROWSER_WORKER_CPUS: ${BROWSER_WORKER_CPUS:-2}
      BROWSER_WORKER_DRIVER: docker
      BROWSER_WORKER_GPU_MODE: ${BROWSER_WORKER_GPU_MODE:-auto}
      BROWSER_WORKER_IMAGE: ${BROWSER_WORKER_IMAGE:-mediadeck-brave-origin:0.1.0}
      BROWSER_WORKER_MEMORY_MB: ${BROWSER_WORKER_MEMORY_MB:-2048}
      BROWSER_WORKER_NETWORK: ${BROWSER_WORKER_NETWORK:-mediadeck_default}
      BROWSER_WORKER_PIDS_LIMIT: ${BROWSER_WORKER_PIDS_LIMIT:-512}
      BROWSER_WORKER_SHM_MB: ${BROWSER_WORKER_SHM_MB:-1024}
      BROWSER_VAAPI_DRIVER: ${BROWSER_VAAPI_DRIVER:-auto}
      DOCKER_SOCKET_PATH: /var/run/docker.sock
      MAX_BROWSER_SESSIONS: ${MAX_BROWSER_SESSIONS:-1}
      TZ: ${TZ:-Etc/UTC}
    group_add:
      - ${DOCKER_GID:-0}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
