name: mediadeck

services:
  app:
    build:
      context: .
      target: runtime
    image: ${MEDIADECK_IMAGE:-mediadeck:0.1.0}
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      ADDON_MAX_PACKAGE_MB: ${ADDON_MAX_PACKAGE_MB:-25}
      ADDON_WATCH_ENABLED: ${ADDON_WATCH_ENABLED:-false}
      ADDON_WATCH_INTERVAL_SECONDS: ${ADDON_WATCH_INTERVAL_SECONDS:-60}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      DATA_DIR: /data
      FIREFOX_MAJOR_VERSION: ${FIREFOX_MAJOR_VERSION:-153}
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MEDIADECK_UPDATE_MANIFEST_URL: ${MEDIADECK_UPDATE_MANIFEST_URL:-}
      NODE_ENV: production
      PORT: 3000
      PUBLIC_DIR: /app/public
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    ports:
      - '127.0.0.1:${MEDIADECK_PORT:-8080}:3000'
    volumes:
      - mediadeck-data:/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  mediadeck-data:
    name: ${MEDIADECK_DATA_VOLUME:-mediadeck-data}
